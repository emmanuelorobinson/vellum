<!doctype html>
<!-- Renderer spike page (guide Prompt 4). Spike quality; not product UI. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Renderer spike</title>
    <style>
      :root {
        color-scheme: light dark;
        font: 13px system-ui, sans-serif;
      }
      body {
        margin: 0;
        height: 100vh;
        display: grid;
        grid-template-rows: auto 1fr;
        background: Canvas;
        color: CanvasText;
      }
      header {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
        padding: 8px 12px;
        border-bottom: 1px solid GrayText;
      }
      #stage {
        position: relative;
        overflow: hidden;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
        cursor: grab;
      }
      canvas.fixture {
        width: 256px;
        height: 256px;
      }
      #meter {
        font-variant-numeric: tabular-nums;
        min-width: 26ch;
      }
    </style>
  </head>
  <body>
    <header>
      <label>Renderer
        <select id="renderer">
          <option value="a">A: Rust display list, CanvasKit in TS</option>
          <option value="b">B: skia-safe in WASM, WebGL2 from Rust</option>
        </select>
      </label>
      <label>Document
        <select id="scene">
          <option value="nodes:1000">1,000 nodes</option>
          <option value="nodes:5000">5,000 nodes</option>
          <option value="nodes:10000">10,000 nodes</option>
        </select>
      </label>
      <button id="screenshot" type="button">Screenshot</button>
      <span id="meter">Loading</span>
      <span id="status"></span>
    </header>
    <div id="stage"><canvas id="canvas"></canvas></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
