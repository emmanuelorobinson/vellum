[package]
name = "spike-scene"
description = "Plain-data spike documents, the 20 non-text fixtures and the display list both renderers draw."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# Text layout as Prompt 19 will do it: Parley shapes and breaks lines in Rust, every renderer draws the glyphs.
# No system fonts: the spike registers its own font files so every path sees the same fonts.
parley = { version = "0.12.0", default-features = false, features = ["std"] }
