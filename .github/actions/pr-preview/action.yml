name: Vellum PR preview
description: Render committed before/after frame PNGs and upload them as workflow artifacts. No account needed.
inputs:
  binary:
    description: Absolute path to a trusted, built vellum executable (with scene support).
    required: true
  repository:
    description: Checked-out Git repository with both revisions available.
    default: '.'
  base:
    description: Base commit SHA (use the merge base for PR-style comparison).
    required: true
  head:
    description: PR head commit SHA.
    required: true
outputs:
  artifact-url:
    description: GitHub download page for before/after PNGs and manifest.json.
    value: ${{ steps.upload.outputs.artifact-url }}
runs:
  using: composite
  steps:
    - name: Render changed frames
      id: render
      shell: bash
      working-directory: ${{ inputs.repository }}
      env:
        VELLUM_BINARY: ${{ inputs.binary }}
        VELLUM_BASE: ${{ inputs.base }}
        VELLUM_HEAD: ${{ inputs.head }}
      run: |
        set -euo pipefail
        [[ "$VELLUM_BASE" =~ ^[a-f0-9]{40,64}$ && "$VELLUM_HEAD" =~ ^[a-f0-9]{40,64}$ ]]
        preview_dir="$(mktemp -d "$RUNNER_TEMP/vellum-preview.XXXXXX")"
        "$VELLUM_BINARY" diff "$VELLUM_BASE..$VELLUM_HEAD" --png --output "$preview_dir/images" --json
        echo "path=$preview_dir/images" >> "$GITHUB_OUTPUT"
    - name: Upload before/after images
      id: upload
      uses: actions/upload-artifact@v4
      with:
        name: vellum-pr-preview
        path: ${{ steps.render.outputs.path }}
        if-no-files-found: error
        retention-days: 14
