name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  TURBO_TELEMETRY_DISABLED: "1"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: rustup toolchain install
      - name: Native renderer source-build prerequisites
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang libclang-dev libgl1-mesa-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: node scripts/skia-build.mjs clippy --locked --workspace --all-targets -- -D warnings
      - run: node scripts/skia-build.mjs test --locked --workspace
      - name: Scripted model tool error and retry (loopback model-http lane)
        run: node scripts/skia-build.mjs test --locked -p vellum --test write_tools a_scripted_agent -- --ignored
      - name: Built-in engine end to end on the stub endpoint (loopback model-http lane)
        run: node scripts/skia-build.mjs test --locked -p vellum --test engine -- --ignored
      - name: Account transport over a synthetic loopback endpoint (no keychain)
        run: cargo test -p vellum-account-http --test http -- --ignored
      - name: Versioned document API declarations match runtime bindings
        run: node scripts/doc-api-gen.mjs --check
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - name: Dependency, licence and source policy (deny.toml, advisories included)
        run: cargo deny check
      - name: Specification unchanged by build and test
        if: always()
        run: node scripts/spec-checksums.mjs check

  typescript:
    name: TypeScript (type-check, lint, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm exec biome check .
      - run: pnpm exec turbo run type-check test --force
      - name: Specification unchanged by build and test
        run: node scripts/spec-checksums.mjs check

  layout-oracle:
    name: Layout oracle (chrome lane)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # The Chrome for Testing build that wrote fixtures/layout-oracle/expected/ (manifest.json).
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: 155.0.8059.39
          install-dependencies: true
      - name: Regenerate the oracle in headless Chrome and compare with the committed boxes
        env:
          VELLUM_CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: bash scripts/gen-layout-oracle.sh --check
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Production LayoutEngine contract and 150+ oracle fixtures (ADR-002)
        run: cargo test -p vellum-layout-taffy

  text-fixtures:
    name: Text fixtures (fonts lane)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Fetch pinned text fixture fonts (checksum verified)
        run: node spikes/renderer/scripts/fetch-fonts.mjs
      - name: Verify the Prompt 5 glyph oracle
        run: node scripts/gen-text-fixtures.mjs --check
      - name: Production text fixtures and FontSource contract
        run: cargo test -p vellum-text-parley --test fonts_lane -- --ignored

  repo:
    name: Repo checks (script tests, dependency rules, clean room, copy, specification checksums)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: rustup toolchain install
      - name: Native prerequisites for the format-files example's dev dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang libclang-dev libgl1-mesa-dev
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - run: pnpm test:scripts
      - run: pnpm deps:check
      - run: pnpm clean-room
      - run: pnpm copy-lint
      - name: Every v1 parity row has a named behavior test or an explicit pending blocker
        run: pnpm parity:check
      - name: Report release blockers (inventory, never a release authorization)
        run: node scripts/release.mjs status > release-blockers.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-blocker-inventory
          path: release-blockers.json
      - name: Design snapshots are current and complete (no pen.dev needed)
        run: pnpm design:check
      - name: Design tokens match vellum.pen, generated files are current, DESIGN.md gaps are resolved
        run: pnpm tokens:check
      - name: Token contrast and usage lints
        run: pnpm tokens:lint
      - name: Generated TypeScript bindings match vellum-types
        run: pnpm types:check
      - name: docs/format (JSON Schema and reference page) matches vellum-types
        run: pnpm format-spec:check
      - name: Specification unchanged by build and test
        run: node scripts/spec-checksums.mjs check
