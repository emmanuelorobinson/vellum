name: Installed hosts
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
env:
  TURBO_TELEMETRY_DISABLED: '1'
  NEXT_TELEMETRY_DISABLED: '1'
jobs:
  vscode:
    name: VS Code ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-26, target: darwin-arm64 }
          - { os: macos-26-intel, target: darwin-x64 }
          - { os: windows-2025, target: win32-x64 }
          - { os: windows-11-arm, target: win32-arm64 }
          - { os: ubuntu-24.04, target: linux-x64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked -p vellum --no-default-features
      - name: VS Code custom-editor acceptance (vscode lane)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a pnpm --filter @vellum/extension test:vscode
          else
            pnpm --filter @vellum/extension test:vscode
          fi
      - if: always()
        run: pnpm checksum
  electron:
    name: Electron ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-26, target: darwin-arm64 }
          - { os: macos-26-intel, target: darwin-x64 }
          - { os: windows-2025, target: win32-x64 }
          - { os: windows-11-arm, target: win32-arm64 }
          - { os: ubuntu-24.04, target: linux-x64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: node apps/desktop/node_modules/electron/install.js
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked -p vellum --no-default-features
      - name: Electron isolation and lifecycle acceptance (electron lane)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a pnpm --filter @vellum/desktop test:electron
          else
            pnpm --filter @vellum/desktop test:electron
          fi
      - if: always()
        run: pnpm checksum
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: host-electron-${{ matrix.target }}
          path: target/desktop-test-results/
