name: Vellum PR preview comment
on:
  workflow_run:
    workflows: [Vellum PR previews]
    types: [completed]
permissions:
  contents: read
  actions: read
  pull-requests: write
concurrency:
  group: vellum-preview-comment-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false
jobs:
  comment:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # workflow_run uses the default branch. Never checkout the PR or download its artifact here.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          script: |
            const { publish } = await import(`${process.env.GITHUB_WORKSPACE}/.github/actions/pr-preview/comment.mjs`);
            await publish({ github, context });
