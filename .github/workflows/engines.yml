name: Installed engines (nightly)
on:
  workflow_dispatch:
  schedule:
    - cron: "20 2 * * *"
permissions:
  contents: read
concurrency:
  group: installed-engines
  cancel-in-progress: false
env:
  TURBO_TELEMETRY_DISABLED: "1"
  NEXT_TELEMETRY_DISABLED: "1"
jobs:
  claude-code:
    # A trusted runner with an existing sign-in; never run subscription credentials on PR code.
    if: vars.VELLUM_ENGINES_ENABLED == 'true'
    runs-on: [self-hosted, vellum-engines]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Real Claude Code MCP and Stop (engines lane)
        run: cargo test -p vellum --no-default-features --test installed_engine engines_lane -- --ignored --test-threads=1
      - name: Real Claude Code parallel lanes, Side by side (engines lane, builds the scene)
        run: cargo test -p vellum --test installed_parallel engines_lane -- --ignored --test-threads=1
      - name: Record a transcript for the installed version
        run: bash scripts/record-engine-fixtures.sh
      - name: Specification unchanged
        run: node scripts/spec-checksums.mjs check
      - uses: actions/upload-artifact@v4
        with:
          name: claude-code-projected-transcript
          path: fixtures/engines/claude-code/*/*.recorded.*
  codex:
    # A trusted runner with an existing sign-in; never run subscription credentials on PR code.
    if: vars.VELLUM_ENGINES_ENABLED == 'true'
    runs-on: [self-hosted, vellum-engines]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Real Codex canvas, usage and Stop (engines lane)
        run: cargo test -p vellum --no-default-features --test installed_codex engines_lane -- --ignored --test-threads=1
      - name: Record a transcript for the installed version
        run: bash scripts/record-engine-fixtures.sh --engine codex
      - name: Record the exec fallback transcript
        run: bash scripts/record-engine-fixtures.sh --engine codex --transport exec
      - name: Specification unchanged
        run: node scripts/spec-checksums.mjs check
      - uses: actions/upload-artifact@v4
        with:
          name: codex-projected-transcript
          path: fixtures/engines/codex/*/*.recorded.*
