name: Native IPC
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ipc-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  TURBO_TELEMETRY_DISABLED: "1"
  NEXT_TELEMETRY_DISABLED: "1"
jobs:
  ipc:
    name: IPC (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Transport, directory security and framing contracts
        run: cargo test -p vellum-ipc-local --lib
      - name: Daemon lifecycle, socket inventory and bridge (ipc lane)
        run: node scripts/ipc.mjs
      - name: IPC and CLI clippy
        run: cargo clippy -p vellum-ipc-local -p vellum --lib --bins --no-default-features -- -D warnings
      - name: Specification unchanged
        run: node scripts/spec-checksums.mjs check
