name: Shaders
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
env:
  TURBO_TELEMETRY_DISABLED: "1"
  NEXT_TELEMETRY_DISABLED: "1"
jobs:
  shader-contracts:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: node scripts/skia-build.mjs test --locked -p vellum-shader-sksl --test compiler
      - run: node scripts/skia-build.mjs test --locked -p vellum-render-skia --test shaders --test appearance --test cache
      - run: node scripts/skia-build.mjs test --locked -p vellum --test shaders
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shader-native-examples
          path: target/shader-examples/
      - name: Specification intact
        if: always()
        run: node scripts/spec-checksums.mjs check
