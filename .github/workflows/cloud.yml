name: Cloud ports
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
env:
  TURBO_TELEMETRY_DISABLED: '1'
  NEXT_TELEMETRY_DISABLED: '1'
jobs:
  cloud:
    name: Postgres and Redis contracts (no vendor accounts)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd 'redis-cli ping' --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Explicit cloud migrations and idempotent rerun
        env:
          DATABASE_URL: postgres://postgres:test-only@127.0.0.1:5432/postgres
        run: |
          pnpm --filter @vellum/api migrate
          pnpm --filter @vellum/api migrate
      - name: Auth, billing, queues, mail and API contracts
        env:
          VELLUM_TEST_DATABASE_URL: postgres://postgres:test-only@127.0.0.1:5432/postgres
          VELLUM_TEST_REDIS_URL: redis://127.0.0.1:6379
        run: pnpm --filter @vellum/auth --filter @vellum/billing --filter @vellum/jobs --filter @vellum/mail --filter @vellum/storage --filter @vellum/host-browser --filter @vellum/api --filter @vellum/account test
      - run: rustup toolchain install
      - run: sudo apt-get update && sudo apt-get install -y ninja-build clang libclang-dev libgl1-mesa-dev
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.6
          actions-cache-folder: emsdk-cache
      - uses: Swatinem/rust-cache@v2
        with:
          key: cloud-viewer-${{ hashFiles('scripts/skia-config.json', 'patches/skia-bindings/**') }}
          cache-all-crates: true
      - run: pnpm wasm:build
      - run: pnpm --filter @vellum/account --filter @vellum/web build
      - name: Specification intact
        if: always()
        run: pnpm checksum
