[package]
name = "vellum-wasm"
description = "Composition root: the browser engine (vellum-core plus the renderer chosen by ADR-001)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["rlib"]

[dependencies]
vellum-types = { path = "../vellum-types" }

[lints]
workspace = true

[target.'cfg(target_os = "emscripten")'.dependencies]
vellum-core = { path = "../vellum-core" }
vellum-render-skia = { path = "../adapters/render-skia" }

[[bin]]
name = "vellum-editor"
path = "src/main.rs"
