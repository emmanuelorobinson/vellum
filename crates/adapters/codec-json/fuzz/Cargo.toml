[package]
name = "vellum-codec-json-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
vellum-codec-json = { path = ".." }

[[bin]]
name = "decode"
path = "fuzz_targets/decode.rs"
test = false
doc = false
bench = false

# Its own workspace: a fuzz build needs nightly and must not join the product graph.
[workspace]
