[package]
name = "vellum-model-http"
description = "Bounded, credential-redacting SSE transport for ModelProvider adapters."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
vellum-core = { path = "../../vellum-core" }
serde_json.workspace = true
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "json"] }
tokio = { version = "=1.53.2", features = ["rt-multi-thread", "net", "time", "macros"] }
async-channel = "=2.5.0"
url = "=2.5.8"

[lints]
workspace = true

[dev-dependencies]
vellum-contracts = { path = "../../contracts" }
