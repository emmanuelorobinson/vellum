[package]
name = "vellum-assets-fs"
description = "The local file system: FileSystem, and AssetStore by content hash in <name>.assets/."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
vellum-core = { path = "../../vellum-core" }
# SHA-256 of an asset's bytes is its name on disk. Only this adapter may use it (deny.toml).
sha2 = "0.11.1"

[dev-dependencies]
vellum-contracts = { path = "../../contracts" }
vellum-types = { path = "../../vellum-types" }

[lints]
workspace = true
