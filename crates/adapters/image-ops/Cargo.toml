[package]
name = "vellum-image-ops"
description = "ImageOps: remove background, trace to vectors (v1.1)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
vellum-core = { path = "../../vellum-core" }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
visioncortex = { version = "=0.8.8", default-features = false }
tract-onnx = { version = "=0.23.9", default-features = false }

[lints]
workspace = true

[dev-dependencies]
vellum-contracts = { path = "../../contracts" }
