[package]
name = "vellum-sync-ws"
description = "Bounded authenticated sync WebSocket transport."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
[features]
test-client = ["dep:tungstenite"]

[dependencies]
tungstenite = { version = "=0.29.0", optional = true }
vellum-core = { path = "../../vellum-core" }
vellum-types = { path = "../../vellum-types" }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio", "ws"] }
tokio = { version = "=1.53.2", features = ["rt-multi-thread", "net", "time", "macros", "signal", "sync"] }
serde.workspace = true
serde_json.workspace = true
[dev-dependencies]
tungstenite = "=0.29.0"
vellum-contracts = { path = "../../contracts" }
[lints]
workspace = true
