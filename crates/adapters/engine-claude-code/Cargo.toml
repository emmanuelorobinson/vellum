[package]
name = "vellum-engine-claude-code"
description = "AgentEngine: the user's installed Claude Code."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
vellum-core = { path = "../../vellum-core" }
vellum-types = { path = "../../vellum-types" }
serde_json.workspace = true
tokio = { version = "=1.53.2", features = ["rt-multi-thread", "process", "io-util", "time", "sync", "macros"] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.190"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
vellum-contracts = { path = "../../contracts" }
