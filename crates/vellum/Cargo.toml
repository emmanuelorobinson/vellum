[package]
name = "vellum"
description = "Composition root: the vellum daemon, CLI and MCP bridge. One binary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "vellum"
path = "src/main.rs"

[dependencies]
clap.workspace = true
vellum-types = { path = "../vellum-types" }

[lints]
workspace = true

[dev-dependencies]
serde_json.workspace = true
vellum-core = { path = "../vellum-core" }
vellum-render-skia = { path = "../adapters/render-skia" }
vellum-text-parley = { path = "../adapters/text-parley" }
vellum-codec-json = { path = "../adapters/codec-json" }
vellum-layout-taffy = { path = "../adapters/layout-taffy" }
vellum-index-rstar = { path = "../adapters/index-rstar" }
vellum-codec-json-dir = { path = "../adapters/codec-json-dir" }
vellum-assets-fs = { path = "../adapters/assets-fs" }
vellum-contracts = { path = "../contracts" }
