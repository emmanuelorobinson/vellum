[package]
name = "vellum"
description = "Composition root: the vellum daemon, CLI and MCP bridge. One binary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "vellum"
path = "src/main.rs"

[dependencies]
clap.workspace = true
vellum-ipc-local = { path = "../adapters/ipc-local" }
vellum-types = { path = "../vellum-types" }
vellum-core = { path = "../vellum-core" }
vellum-codec-json-dir = { path = "../adapters/codec-json-dir" }
vellum-codec-json = { path = "../adapters/codec-json" }
vellum-doc-loro = { path = "../adapters/doc-loro" }
vellum-assets-fs = { path = "../adapters/assets-fs" }
vellum-watch-notify = { path = "../adapters/watch-notify" }
vellum-layout-taffy = { path = "../adapters/layout-taffy", optional = true }
vellum-text-parley = { path = "../adapters/text-parley", optional = true }
vellum-render-skia = { path = "../adapters/render-skia", optional = true }
vellum-index-rstar = { path = "../adapters/index-rstar", optional = true }
vellum-script-quickjs = { path = "../adapters/script-quickjs", optional = true }
getrandom = "=0.4.3"
serde.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
schemars.workspace = true

[features]
default = ["scene", "scripts"]
# Layout, text and Skia drawing: what snapshot_layout, find_space and screenshot need. The IPC lane builds the
# daemon without it, so that lane compiles no renderer (ADR-021).
scene = [
    "dep:vellum-layout-taffy",
    "dep:vellum-text-parley",
    "dep:vellum-render-skia",
    "dep:vellum-index-rstar",
]
# The QuickJS sandbox `execute` runs in. Without it `execute` says so; every other tool works.
scripts = ["dep:vellum-script-quickjs"]

[lints]
workspace = true

[dev-dependencies]
vellum-layout-taffy = { path = "../adapters/layout-taffy" }
vellum-text-parley = { path = "../adapters/text-parley" }
vellum-render-skia = { path = "../adapters/render-skia" }
vellum-index-rstar = { path = "../adapters/index-rstar" }
vellum-script-quickjs = { path = "../adapters/script-quickjs" }
vellum-contracts = { path = "../contracts" }

vellum-testkit = { path = "../vellum-testkit" }
vellum-llm-openai-compat = { path = "../adapters/llm-openai-compat" }
vellum-model-http = { path = "../adapters/model-http" }
vellum-engine-builtin = { path = "../adapters/engine-builtin" }
