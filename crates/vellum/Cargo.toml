[package]
name = "vellum"
description = "Composition root: the vellum daemon, CLI and MCP bridge. One binary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "vellum"
path = "src/main.rs"

[dependencies]
vellum-telemetry-http = { path = "../adapters/telemetry-http" }
vellum-import-pen = { path = "../adapters/import-pen" }
vellum-image-ops = { path = "../adapters/image-ops" }
vellum-images-generate = { path = "../adapters/images-generate" }
vellum-import-figma-api = { path = "../adapters/import-figma-api" }
vellum-browser-cdp = { path = "../adapters/browser-cdp" }
vellum-import-html = { path = "../adapters/import-html" }
vellum-account-http = { path = "../adapters/account-http" }
vellum-engine-codex = { path = "../adapters/engine-codex" }
vellum-engine-claude-code = { path = "../adapters/engine-claude-code" }
clap.workspace = true
vellum-ipc-local = { path = "../adapters/ipc-local" }
vellum-sync-ws = { path = "../adapters/sync-ws", features = ["client"] }
vellum-types = { path = "../vellum-types" }
vellum-core = { path = "../vellum-core" }
vellum-codec-json-dir = { path = "../adapters/codec-json-dir" }
vellum-codec-json = { path = "../adapters/codec-json" }
vellum-export-html = { path = "../adapters/export-html" }
vellum-export-raster = { path = "../adapters/export-raster" }
vellum-export-tokens = { path = "../adapters/export-tokens" }
vellum-icons = { path = "../adapters/icons" }
vellum-import-image = { path = "../adapters/import-image" }
vellum-import-svg = { path = "../adapters/import-svg" }
vellum-import-figma-clipboard = { path = "../adapters/import-figma-clipboard" }
vellum-images-stock = { path = "../adapters/images-stock" }
vellum-doc-loro = { path = "../adapters/doc-loro" }
vellum-assets-fs = { path = "../adapters/assets-fs" }
vellum-watch-notify = { path = "../adapters/watch-notify" }
vellum-sessions-sqlite = { path = "../adapters/sessions-sqlite" }
vellum-layout-taffy = { path = "../adapters/layout-taffy", optional = true }
vellum-text-parley = { path = "../adapters/text-parley", optional = true }
vellum-render-skia = { path = "../adapters/render-skia", optional = true }
vellum-shader-sksl = { path = "../adapters/shader-sksl", optional = true }
vellum-index-rstar = { path = "../adapters/index-rstar", optional = true }
vellum-script-quickjs = { path = "../adapters/script-quickjs", optional = true }
vellum-engine-builtin = { path = "../adapters/engine-builtin" }
vellum-model-http = { path = "../adapters/model-http" }
vellum-llm-openai-compat = { path = "../adapters/llm-openai-compat" }
vellum-llm-openai-responses = { path = "../adapters/llm-openai-responses" }
vellum-llm-anthropic = { path = "../adapters/llm-anthropic" }
vellum-llm-google = { path = "../adapters/llm-google" }
vellum-secrets-keyring = { path = "../adapters/secrets-keyring" }
getrandom = "=0.4.3"
serde.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
schemars.workspace = true

[features]
default = ["scene", "scripts"]
# Layout, text and Skia drawing: what snapshot_layout, find_space and screenshot need. The IPC lane builds the
# daemon without it, so that lane compiles no renderer (ADR-021).
scene = [
    "dep:vellum-layout-taffy",
    "dep:vellum-text-parley",
    "dep:vellum-render-skia",
    "dep:vellum-shader-sksl",
    "dep:vellum-index-rstar",
]
# The QuickJS sandbox `execute` runs in. Without it `execute` says so; every other tool works.
scripts = ["dep:vellum-script-quickjs"]

[lints]
workspace = true

[dev-dependencies]
zip = { version = "=4.6.1", default-features = false }
vellum-layout-taffy = { path = "../adapters/layout-taffy" }
vellum-text-parley = { path = "../adapters/text-parley" }
vellum-render-skia = { path = "../adapters/render-skia" }
vellum-index-rstar = { path = "../adapters/index-rstar" }
vellum-script-quickjs = { path = "../adapters/script-quickjs" }
vellum-contracts = { path = "../contracts" }

vellum-testkit = { path = "../vellum-testkit" }
vellum-llm-openai-compat = { path = "../adapters/llm-openai-compat" }
vellum-model-http = { path = "../adapters/model-http" }
vellum-engine-builtin = { path = "../adapters/engine-builtin" }
