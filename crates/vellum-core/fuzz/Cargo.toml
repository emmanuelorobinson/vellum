[package]
name = "vellum-core-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
vellum-core = { path = ".." }
vellum-types = { path = "../../vellum-types" }

[[bin]]
name = "merge"
path = "fuzz_targets/merge.rs"
test = false
doc = false
bench = false

# Its own workspace: a fuzz build needs nightly and must not join the product graph.
[workspace]

[[bin]]
name = "script_header"
path = "fuzz_targets/script_header.rs"
test = false
doc = false
bench = false
