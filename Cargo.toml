[workspace]
resolver = "3"
# Listed explicitly (a `crates/*` glob also matches the manifest-less crates/adapters directory).
# Every directory under crates/adapters/ is an adapter and joins the workspace automatically.
members = [
  "crates/vellum-types",
  "crates/vellum-core",
  "crates/contracts",
  "crates/vellum-wasm",
  "crates/vellum",
  "crates/sync-server",
  "crates/vellum-testkit",
  "crates/adapters/*",
]
# Spikes (guide Phase 1) are separate Cargo workspaces, outside the product dependency graph.
exclude = ["spikes"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Versions every crate shares. Only vellum-types, vellum and (later) adapters add dependencies;
# vellum-core and vellum-types stay on scripts/rust-deps-allowlist.txt (scripts/check-deps.sh enforces it).
[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
schemars = "1.2.2"
ts-rs = { version = "12.0.1", features = ["serde-json-impl"] }
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
trybuild = "1.0.122"
serde_path_to_error = "0.1.20"
clap = { version = "4.6.7", features = ["derive"] }
# Only crates/adapters/doc-loro may depend on it (deny.toml wrappers).
loro = "1.16.2"

# Layout stays behind its adapter. Pinned to the version verified by ADR-002.
taffy = "=0.14.0"
