[workspace]
resolver = "3"
# Listed explicitly (a `crates/*` glob also matches the manifest-less crates/adapters directory).
# Every directory under crates/adapters/ is an adapter and joins the workspace automatically.
members = [
  "crates/vellum-types",
  "crates/vellum-core",
  "crates/contracts",
  "crates/vellum-wasm",
  "crates/vellum",
  "crates/sync-server",
  "crates/vellum-testkit",
  "crates/adapters/*",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Versions every crate shares. Only vellum-types, vellum and (later) adapters add dependencies;
# vellum-core and vellum-types stay on scripts/rust-deps-allowlist.txt (scripts/check-deps.sh enforces it).
[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
schemars = "1.2.2"
ts-rs = "12.0.1"
clap = { version = "4.6.7", features = ["derive"] }
