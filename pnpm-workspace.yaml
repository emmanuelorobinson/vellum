packages:
  - "packages/*"
  - "apps/*"
  # Spike A (Prompt 4): the renderer spike page. Not a product package; nothing may depend on it.
  - "spikes/renderer/web"
  # Spike B (Prompt 5): Loro and QuickJS measurements. Not a product package either.
  - "spikes/engine"

# One place for every shared tool version (guide §5 version policy: exact, no ranges).
catalog:
  # TypeScript 7 is the guide's first choice, but dependency-cruiser 18.5.0 cannot read it and cruises zero
  # modules (version-baseline.md C3), so the repo uses the newest 5.x until that changes.
  typescript: 5.9.3
  vitest: 5.0.5
  # Follows the Node runtime (.nvmrc: 24), not the newest Node major (version-baseline C2).
  "@types/node": 24.19.2
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@types/vscode": 1.140.0
  react: 19.3.0
  react-dom: 19.3.0
  # 16.4.0 is in the advisory range of three Next.js advisories (critical RCE in the image optimizer and in
  # `use cache`, high Server Actions DoS). 16.4.1 is the first patched release; 16.4.2 is the newest patch.
  next: 16.4.2
  electron: 44.7.0
  # Storybook (set up in Prompt 43 with create-storybook 10.6.2; version-baseline.md C15). Exact pins, no ranges.
  "@vitest/browser-playwright": 5.0.5
  "@vitest/coverage-v8": 5.0.5
  storybook: 10.6.2
  "@storybook/html-vite": 10.6.2
  "@storybook/react-vite": 10.6.2
  "@storybook/addon-vitest": 10.6.2
  "@storybook/addon-a11y": 10.6.2
  "@storybook/addon-docs": 10.6.2
  "@chromatic-com/storybook": 5.5.1
  playwright: 1.64.1
  "@playwright/test": 1.64.1
  # Editor UI primitives (Prompt 46; version-baseline.md).
  "@base-ui/react": 1.9.0
  vite: 8.3.4
  # Documentation site (ADR-035; version-baseline.md). Exact pins, like every other catalog line.
  fumadocs-core: 16.16.2
  fumadocs-ui: 16.16.2
  # fumadocs-mdx 15.4.7 and later need fumadocs-core ^16.17.0. The site stays on the 16.16 line, where 15.4.6 is the newest
  # match (version-baseline.md).
  fumadocs-mdx: 15.4.6
  "@types/mdx": 2.0.14
  tailwindcss: 4.3.3
  "@tailwindcss/postcss": 4.3.3

minimumReleaseAgeExclude:
  - "@better-auth/core@1.7.11"
  - "@better-auth/drizzle-adapter@1.7.11"
  - "@better-auth/kysely-adapter@1.7.11"
  - "@better-auth/memory-adapter@1.7.11"
  - "@better-auth/mongo-adapter@1.7.11"
  - "@better-auth/prisma-adapter@1.7.11"
  - "@better-auth/telemetry@1.7.11"
  - better-auth@1.7.11
  - bullmq@6.3.17
