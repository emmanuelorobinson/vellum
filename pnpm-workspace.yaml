packages:
  - "packages/*"
  - "apps/*"
  # Spike A (Prompt 4): the renderer spike page. Not a product package; nothing may depend on it.
  - "spikes/renderer/web"
  # Spike B (Prompt 5): Loro and QuickJS measurements. Not a product package either.
  - "spikes/engine"

# One place for every shared tool version (guide §5 version policy: exact, no ranges).
catalog:
  # TypeScript 7 is the guide's first choice, but dependency-cruiser 18.5.0 cannot read it and cruises zero
  # modules (version-baseline.md C3), so the repo uses the newest 5.x until that changes.
  typescript: 5.9.3
  vitest: 5.0.3
  # Follows the Node runtime (.nvmrc: 24), not the newest Node major (version-baseline C2).
  "@types/node": 24.19.2
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@types/vscode": 1.140.0
  react: 19.3.0
  react-dom: 19.3.0
  next: 16.4.0
  electron: 44.7.0
  # Storybook (set up in Prompt 43 with create-storybook 10.6.2; version-baseline.md C15). Exact pins, no ranges.
  "@vitest/browser-playwright": 5.0.3
  "@vitest/coverage-v8": 5.0.3
  storybook: 10.6.2
  "@storybook/html-vite": 10.6.2
  "@storybook/addon-vitest": 10.6.2
  "@storybook/addon-a11y": 10.6.2
  "@storybook/addon-docs": 10.6.2
  "@chromatic-com/storybook": 5.5.1
  playwright: 1.64.1
  vite: 8.3.4
