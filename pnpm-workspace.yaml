packages:
  - "packages/*"
  - "apps/*"
  # Spike A (Prompt 4): the renderer spike page. Not a product package; nothing may depend on it.
  - "spikes/renderer/web"
  # Spike B (Prompt 5): Loro and QuickJS measurements. Not a product package either.
  - "spikes/engine"

# One place for every shared tool version (guide §5 version policy: exact, no ranges).
catalog:
  # TypeScript 7 is the guide's first choice, but dependency-cruiser 18.5.0 cannot read it and cruises zero
  # modules (version-baseline.md C3), so the repo uses the newest 5.x until that changes.
  typescript: 5.9.3
  vitest: 5.0.3
  # Follows the Node runtime (.nvmrc: 24), not the newest Node major (version-baseline C2).
  "@types/node": 24.19.2
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@types/vscode": 1.140.0
  react: 19.3.0
  react-dom: 19.3.0
  next: 16.4.0
  electron: 44.7.0
