<!doctype html>
<!-- TEST DATA: layout oracle fixture (guide Prompt 6, ADR-002). Vellum sizing semantics as data-* attributes; scripts/gen-layout-oracle.sh maps them to CSS and records the boxes Chrome computes. -->
<title>Row: fill children share space equally whatever they contain</title>
<div data-layout="row" data-width="200" data-height="40">
  <div data-layout="row" data-width="fill" data-height="40">
    <div data-width="150" data-height="10"></div>
  </div>
  <div data-width="fill" data-height="40"></div>
</div>
