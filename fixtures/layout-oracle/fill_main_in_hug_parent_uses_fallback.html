<!doctype html>
<!-- TEST DATA: layout oracle fixture (guide Prompt 6, ADR-002). Vellum sizing semantics as data-* attributes; scripts/gen-layout-oracle.sh maps them to CSS and records the boxes Chrome computes. -->
<title>Fill on the main axis of a hugging row uses its fallback</title>
<div data-layout="row" data-gap="5" data-width="hug" data-height="hug">
  <div data-width="30" data-height="20"></div>
  <div data-width="fill" data-width-fallback="45" data-height="20"></div>
</div>
