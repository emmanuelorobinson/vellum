<!doctype html>
<!-- TEST DATA: layout oracle fixture (guide Prompt 6, ADR-002). Vellum sizing semantics as data-* attributes; scripts/gen-layout-oracle.sh maps them to CSS and records the boxes Chrome computes. -->
<title>Frame without auto-layout: children sit at their own x and y</title>
<div data-padding="10" data-width="200" data-height="150">
  <div data-x="0" data-y="0" data-width="50" data-height="50"></div>
  <div data-x="120" data-y="80" data-width="100" data-height="100"></div>
  <div data-x="-10" data-y="20" data-width="30" data-height="10"></div>
</div>
