<!doctype html>
<!-- TEST DATA: layout oracle fixture (guide Prompt 6, ADR-002). Vellum sizing semantics as data-* attributes; scripts/gen-layout-oracle.sh maps them to CSS and records the boxes Chrome computes. -->
<title>Absolute child that hugs its own children, past the parent's edge</title>
<div data-layout="row" data-width="80" data-height="40">
  <div data-position="absolute" data-x="60" data-y="10" data-layout="row" data-gap="4" data-padding="2" data-width="hug" data-height="hug">
    <div data-width="30" data-height="10"></div>
    <div data-width="30" data-height="10"></div>
  </div>
</div>
