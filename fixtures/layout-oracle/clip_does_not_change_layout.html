<!doctype html>
<!-- TEST DATA: layout oracle fixture (guide Prompt 6, ADR-002). Vellum sizing semantics as data-* attributes; scripts/gen-layout-oracle.sh maps them to CSS and records the boxes Chrome computes. -->
<title>Clipping content does not change layout</title>
<div data-layout="row" data-width="150" data-height="50">
  <div data-layout="row" data-clip="true" data-width="fill" data-height="50">
    <div data-width="200" data-height="10"></div>
  </div>
  <div data-layout="row" data-clip="true" data-width="hug" data-height="hug">
    <div data-width="40" data-height="30"></div>
  </div>
</div>
