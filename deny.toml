# cargo-deny policy (guide Prompt 2; ARCHITECTURE §2.1 dependency rules). `pnpm cargo:deny` runs all four checks
# and needs the network for advisories. `pnpm deps:check` runs the bans, licences and sources checks without it.
# The allowlist of direct dependencies for the pure crates is scripts/rust-deps-allowlist.txt, read by
# scripts/check-deps.sh.

[graph]
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
  "aarch64-unknown-linux-gnu",
  "wasm32-unknown-unknown",
  "wasm32-unknown-emscripten",
]
all-features = true

[output]
feature-depth = 1

[advisories]
ignore = []

[licenses]
# The project licence is still open (ARCHITECTURE §15, question 11), so this list only admits licences
# that let an Apache-2.0 or AGPL-3.0 project depend on the code. Copyleft dependencies need a reviewed entry.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
  "0BSD",
  "BSL-1.0",
  # File-level copyleft. Allowed as a dependency; never ported (THIRD_PARTY_NOTICES.md).
  "MPL-2.0",
]
exceptions = []

[licenses.private]
# Workspace crates are publish = false and carry no licence field.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace crates depend on each other by path (`vellum-types = { path = "../vellum-types" }`). Nothing here
# is published (publish = false), so a path dependency without a version is not an unbounded requirement.
allow-wildcard-paths = true
highlight = "all"
deny = [
  # A vendor crate is reached only through the adapter that wraps it (guide §8, §13).
  { crate = "loro", wrappers = ["vellum-doc-loro"], reason = "Loro sits behind DocStore (Invariant 5)" },
  { crate = "taffy", wrappers = ["vellum-layout-taffy"], reason = "layout goes through the LayoutEngine port" },
  { crate = "parley", wrappers = ["vellum-text-parley"], reason = "text goes through the TextEngine port" },
  { crate = "rstar", wrappers = ["vellum-index-rstar"], reason = "the spatial index goes through its port" },
  { crate = "skia-safe", wrappers = ["vellum-render-skia"], reason = "drawing goes through the Renderer port" },
  { crate = "rquickjs", wrappers = ["vellum-script-quickjs"], reason = "scripts run only in ScriptRuntime (Invariant 8)" },
  { crate = "rusqlite", wrappers = ["vellum-sessions-sqlite"], reason = "sessions go through the SessionStore port" },
  { crate = "keyring", wrappers = ["vellum-secrets-keyring"], reason = "keys live in the OS keychain only (Invariant 10)" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
