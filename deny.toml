# cargo-deny policy (guide Prompt 2; ARCHITECTURE §2.1 dependency rules). `pnpm cargo:deny` runs all four checks
# and needs the network for advisories. `pnpm deps:check` runs the bans, licences and sources checks without it.
# The allowlist of direct dependencies for the pure crates is scripts/rust-deps-allowlist.txt, read by
# scripts/check-deps.sh.

[graph]
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
  "aarch64-unknown-linux-gnu",
  "wasm32-unknown-unknown",
  "wasm32-unknown-emscripten",
]
all-features = true

[output]
feature-depth = 1

[advisories]
ignore = []

[licenses]
# The owner selected Apache-2.0 (Prompt 56 follow-up). Keep dependencies compatible with that choice;
# copyleft dependencies still need a reviewed entry. Existing explicit exceptions remain in force.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
  "0BSD",
  "BSL-1.0",
  # File-level copyleft. Allowed as a dependency; never ported (THIRD_PARTY_NOTICES.md).
  "MPL-2.0",
]
# Mozilla root certificate data, read/reviewed under ADR-023; retain its agreement on redistribution.
exceptions = [{ crate = "webpki-root-certs@=1.0.9", allow = ["CDLA-Permissive-2.0"] }]

[licenses.private]
# Workspace crates are publish = false and carry no licence field.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace crates depend on each other by path (`vellum-types = { path = "../vellum-types" }`). Nothing here
# is published (publish = false), so a path dependency without a version is not an unbounded requirement.
allow-wildcard-paths = true
highlight = "all"
deny = [
  { crate = "tokio", wrappers = ["vellum-ipc-local", "vellum-model-http", "vellum-account-http", "vellum-engine-claude-code", "vellum-engine-codex", "reqwest", "hyper", "hyper-util", "hyper-rustls", "tower", "tokio-rustls", "wasm-bindgen-futures"], reason = "native runtimes stay in IPC, model/account HTTP and installed engine adapters (ADR-003, ADR-023, ADR-007)" },
  { crate = "reqwest", wrappers = ["vellum-model-http", "vellum-account-http"], reason = "model and account HTTP stay in their bounded transport adapters (ADR-023, Prompt 61)" },
  { crate = "secret-service", wrappers = ["zbus-secret-service-keyring-store"], reason = "keyring Linux backend only (ADR-023)" },
  # A vendor crate is reached only through the adapter that wraps it (guide §8, §13).
  { crate = "loro", wrappers = ["vellum-doc-loro"], reason = "Loro sits behind DocStore (Invariant 5)" },
  { crate = "taffy", wrappers = ["vellum-layout-taffy"], reason = "layout goes through the LayoutEngine port" },
  { crate = "parley", wrappers = ["vellum-text-parley"], reason = "text goes through the TextEngine port" },
  { crate = "rstar", wrappers = ["vellum-index-rstar"], reason = "the spatial index goes through its port" },
  { crate = "zip", wrappers = ["vellum-export-raster", "vellum"], reason = "deterministic export bundles; composition-root dev tests inspect archives" },
  { crate = "skia-safe", wrappers = ["vellum-render-skia"], reason = "drawing goes through the Renderer port" },
  { crate = "rquickjs", wrappers = ["vellum-script-quickjs"], reason = "scripts run only in ScriptRuntime (Invariant 8)" },
  { crate = "rusqlite", wrappers = ["vellum-sessions-sqlite"], reason = "sessions go through the SessionStore port" },
  { crate = "keyring", wrappers = ["vellum-secrets-keyring"], reason = "keys live in the OS keychain only (Invariant 10)" },
  { crate = "sha2", wrappers = ["vellum-assets-fs", "vellum-sessions-sqlite", "secret-service"], reason = "asset hashing, session picture names and Secret Service encryption only (ADR-018, ADR-023, ADR-006)" },
  { crate = "notify", wrappers = ["vellum-watch-notify"], reason = "file events go through the FileWatcher port (ADR-020)" },
  { crate = "wuff", wrappers = ["vellum-text-parley"], reason = "web fonts are unpacked inside the text adapter (ADR-018)" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
